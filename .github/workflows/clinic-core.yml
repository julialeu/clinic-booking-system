name: Clinic Core

on:
  push:
    branches: [main]
    paths:
      - 'clinic-core/**'
      - '.github/workflows/clinic-core.yml'
  pull_request:
    paths:
      - 'clinic-core/**'
      - '.github/workflows/clinic-core.yml'

jobs:
  test:
    name: Clinic Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clinic-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: clinic-core/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...