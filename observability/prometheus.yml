global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: clinic-core
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: clinic-core

  - job_name: notification-service
    static_configs:
      - targets: ['host.docker.internal:9092']
        labels:
          service: notification-service